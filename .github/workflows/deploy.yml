name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject web3form access key
        env:
          WEB3FORM_KEY: ${{ secrets.WEB3FORM_ACCESS_KEY }}
        run: |
          python -c "
          import os
          with open('app.js', 'r') as f:
              content = f.read()
          content = content.replace('__WEB3FORM_ACCESS_KEY__', os.environ['WEB3FORM_KEY'])
          with open('app.js', 'w') as f:
              f.write(content)
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
