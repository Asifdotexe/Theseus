name: Theseus Data Engine

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run Mode (Default is Resume Run)'
        required: true
        type: choice
        options:
          - "Resume Run (Pick up where left off)"
          - "Complete Extraction (Wipe and rebuild all)"
        default: "Resume Run (Pick up where left off)"
      full_fossil_scan:
        description: 'Run a full deep-scan for fossils (uncheck to only do a fast survivor update)'
        required: false
        type: boolean
        default: false


concurrency:
  group: theseus-data-engine
  cancel-in-progress: false

jobs:
  discover-repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.extract.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        run: |
          REPOS=$(jq -c '[.repositories[].name]' theseus.config.json)
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"

  analyze:
    needs: discover-repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.discover-repos.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "engine -> target"

      - name: Build engine
        working-directory: engine
        run: cargo build --release

      - name: Run pipeline for ${{ matrix.repo }}
        id: pipeline
        continue-on-error: true
        env:
          REPO_NAME: ${{ matrix.repo }}
          RUN_MODE: ${{ inputs.run_mode }}
        run: |
          ARGS=()
          if [[ "$RUN_MODE" == "Complete Extraction (Wipe and rebuild all)" ]]; then
            ARGS+=(--reprocess "all")
          fi
          if [ "${{ inputs.full_fossil_scan }}" != "true" ]; then
            ARGS+=(--update-survivor)
          fi
          poetry run python -m scripts.run_pipeline --repo "$REPO_NAME" "${ARGS[@]}"
        timeout-minutes: 120

      - name: Save status
        env:
          REPO_NAME: ${{ matrix.repo }}
        run: |
          mkdir -p data/.status
          STATUS="${{ steps.pipeline.outcome == 'success' && 'success' || 'failure' }}"
          echo "{\"repo\": \"$REPO_NAME\", \"status\": \"$STATUS\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > "data/.status/$REPO_NAME.json"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: data-${{ matrix.repo }}
          path: |
            data/raw/${{ matrix.repo }}_history.jsonl
            data/raw/${{ matrix.repo }}_fossils.json
            data/state/${{ matrix.repo }}_state.json
            data/processed/${{ matrix.repo }}_graph.json
            data/.status/${{ matrix.repo }}.json
          retention-days: 1

  create-pr:
    needs: analyze
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all data artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: .
          pattern: data-*
          merge-multiple: true

      - name: Build PR body
        run: python scripts/workflow.py build-pr-body

      - name: Validate graph files
        run: python scripts/workflow.py validate-graph-files

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/monthly-data-update
          git add data/
          if git diff --cached --quiet; then
            echo "No changes, skipping PR creation."
            exit 0
          fi
          git commit -m "chore: update persistence data"
          git push origin chore/monthly-data-update --force

          PR_NUMBER=$(gh pr list --head chore/monthly-data-update --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head chore/monthly-data-update \
              --title "chore: monthly theseus data pipeline update" \
              --body-file pr-body.md \
              --label "automated pr,data update"
          else
            gh pr edit "$PR_NUMBER" \
              --title "chore: monthly theseus data pipeline update" \
              --body-file pr-body.md \
              --add-label "automated pr,data update"
          fi
