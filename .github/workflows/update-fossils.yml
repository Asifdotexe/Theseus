name: Update Fossils

on:
  workflow_dispatch:

concurrency:
  group: update-fossils
  cancel-in-progress: false

jobs:
  update-fossils:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Update fossils
        run: |
          poetry run python scripts/add_fossils.py
          poetry run python scripts/cleanup_data.py
        timeout-minutes: 180

      - name: Push to chore/fossil-update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/fossil-update
          git add data/
          if git diff --cached --quiet; then
            echo "No fossil changes to commit."
            exit 0
          fi
          git commit -m "chore: update fossils for $(date -u +%Y-%m-%d)"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git chore/fossil-update --force
